name: Build signed desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: ${{ vars.AMM_RELEASE_REPOSITORY || github.repository }}
  UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis,msi
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bundles: appimage,deb
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure signed update channel
        shell: python
        run: |
          import json, os, pathlib, re
          version = json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())['version']
          if os.environ['GITHUB_REF_NAME'] != f'v{version}' or not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Use a stable vX.Y.Z tag matching tauri.conf.json')
          key = os.environ['UPDATER_PUBLIC_KEY'].strip()
          if not key:
              raise SystemExit('Set the TAURI_UPDATER_PUBLIC_KEY repository variable')
          repo = os.environ['RELEASE_REPOSITORY']
          config = {'bundle': {'createUpdaterArtifacts': True}, 'plugins': {'updater': {
              'pubkey': key, 'endpoints': [f'https://github.com/{repo}/releases/latest/download/latest.json']}}}
          pathlib.Path('release.conf.json').write_text(json.dumps(config), encoding='utf-8')
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: yarn install --frozen-lockfile
      - name: Build and sign updater packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config release.conf.json -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi*
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify signatures and assemble latest.json
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          python3 scripts/prepare-updater-release.py
      - name: Upload complete draft for publication
        env:
          GH_TOKEN: ${{ secrets.AMM_RELEASE_TOKEN || github.token }}
        run: |
          test "$(gh api "repos/$RELEASE_REPOSITORY" --jq .visibility)" = public || { echo 'The updater needs a public release repository'; exit 1; }
          if gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPOSITORY" --json isDraft > release-state.json; then
            jq -e .isDraft release-state.json >/dev/null
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$RELEASE_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$RELEASE_REPOSITORY" --draft --title "Agent Mod Manager $GITHUB_REF_NAME" --notes "Agent Mod Manager $GITHUB_REF_NAME"
          fi
