name: Verify And Package

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      verify_linux:
        description: Build and smoke-test Linux desktop packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: node --test scripts/bing-search.test.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-evidence
          path: output/playwright/
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    strategy:
      fail-fast: false
      matrix:
        # Linux native dependencies and package smoke tests are opt-in.
        include: >-
          ${{ fromJSON(format('[{0},{1}{2}]',
            '{"os":"windows-latest","bundles":"nsis,msi"}',
            '{"os":"macos-latest","bundles":"dmg"}',
            github.event_name == 'workflow_dispatch' && inputs.verify_linux
              && ',{"os":"ubuntu-24.04","bundles":"appimage,deb"}' || '')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Native Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libdbus-1-dev webkit2gtk-driver dbus-x11 xauth xvfb xdotool fonts-noto-cjk sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn prepare:seven-zip
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build Unsigned Installers
        id: bundle
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --bundles "${{ matrix.bundles }}" -- --locked
      - name: Verify Native MCP Runtime Offline
        run: python scripts/verify-mcp-runtime.py src-tauri/resources
      - name: Verify Native 7-Zip CLI Offline
        run: python scripts/prepare-mcp-runtime.py --verify-seven-zip src-tauri/resources
      - name: Verify Bundled npx MCP Connection Offline
        run: node scripts/test-rust.mjs --locked --lib bundled_npx_connects_offline -- --ignored
      - name: Install Linux WebDriver Bridge
        if: runner.os == 'Linux'
        id: webdriver
        run: cargo install tauri-driver --locked --version 2.1.0
      - name: Smoke Test Installed Debian Package
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          sudo dpkg --install "${packages[0]}"
          python scripts/verify-mcp-runtime.py '/usr/lib/Agent Mod Manager'
          python scripts/prepare-mcp-runtime.py --verify-seven-zip '/usr/lib/Agent Mod Manager'
          bash scripts/run-linux-package-smoke.sh /usr/bin/agent-mod-manager output/linux-package-smoke/deb
      - name: Verify Packaged AppImage Runtimes
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          shopt -s nullglob
          packages=("$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#packages[@]}" -eq 1
          work=$(mktemp -d)
          (cd "$work" && "${packages[0]}" --appimage-extract 'usr/lib/Agent Mod Manager/mcp-runtime/runtime.zip')
          python scripts/verify-mcp-runtime.py "$work/squashfs-root/usr/lib/Agent Mod Manager"
          mkdir "$work/verify-7zip"
          (cd "$work/verify-7zip" && "${packages[0]}" --appimage-extract 'usr/lib/Agent Mod Manager/seven-zip/*')
          python scripts/prepare-mcp-runtime.py --verify-seven-zip "$work/verify-7zip/squashfs-root/usr/lib/Agent Mod Manager"
      - name: Smoke Test AppImage In Extraction Mode
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.webdriver.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#packages[@]}" -eq 1
          bash scripts/run-linux-package-smoke.sh "${packages[0]}" output/linux-package-smoke/appimage
      - name: Verify 7-Zip In macOS DMG
        if: runner.os == 'macOS'
        timeout-minutes: 4
        run: |
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          mount_point=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "${images[0]}"
          trap 'hdiutil detach "$mount_point"' EXIT
          applications=("$mount_point"/*.app)
          test "${#applications[@]}" -eq 1
          resource_dir="${applications[0]}/Contents/Resources"
          test -x "$resource_dir/seven-zip/7zz"
          python scripts/prepare-mcp-runtime.py --verify-seven-zip "$resource_dir"
      - name: Smoke Test macOS App Launch
        if: runner.os == 'macOS'
        timeout-minutes: 4
        run: |
          shopt -s nullglob
          applications=(src-tauri/target/release/bundle/macos/*.app)
          test "${#applications[@]}" -eq 1
          python scripts/verify-mcp-runtime.py "${applications[0]}/Contents/Resources"
          node scripts/run-macos-package-smoke.mjs "$PWD/${applications[0]}" "$PWD/output/macos-package-smoke"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.bundle.outcome == 'success' }}
        with:
          name: linux-package-smoke-evidence
          path: output/linux-package-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.bundle.outcome == 'success' }}
        with:
          name: macos-package-smoke-evidence
          path: output/macos-package-smoke/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        with:
          name: unsigned-desktop-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14

  windows-installer-smoke:
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: nsis
            pattern: '*-setup.exe'
          - kind: msi
            pattern: '*.msi'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-desktop-windows-latest
          path: output/windows-package-smoke/installers/
      - name: Install And Smoke Test ${{ matrix.kind }}
        shell: pwsh
        env:
          PACKAGE_KIND: ${{ matrix.kind }}
          PACKAGE_PATTERN: ${{ matrix.pattern }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath (Join-Path 'output/windows-package-smoke/installers' $env:PACKAGE_KIND) -File -Filter $env:PACKAGE_PATTERN)
          if ($packages.Count -ne 1) { throw "Expected one $env:PACKAGE_KIND installer; found $($packages.Count)" }
          ./scripts/run-windows-package-smoke.ps1 -Kind $env:PACKAGE_KIND -Installer $packages[0].FullName `
            -EvidenceDir 'output/windows-package-smoke/evidence' -DisposableMachine
          # The smoke runner creates a fresh installation directory and records it in its evidence.
          $target = @(Select-String -LiteralPath 'output/windows-package-smoke/evidence/run.log' -Pattern '^Install target: (.+); Node: ')
          if ($target.Count -ne 1) { throw 'Expected one fresh install target in the smoke evidence.' }
          python scripts/verify-mcp-runtime.py $target[0].Matches[0].Groups[1].Value
          if ($LASTEXITCODE -ne 0) { throw 'Installed MCP runtime verification failed.' }
          python scripts/prepare-mcp-runtime.py --verify-seven-zip $target[0].Matches[0].Groups[1].Value
          if ($LASTEXITCODE -ne 0) { throw 'Installed 7-Zip verification failed.' }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: windows-${{ matrix.kind }}-smoke-evidence
          path: output/windows-package-smoke/evidence/
          if-no-files-found: ignore
          retention-days: 7
